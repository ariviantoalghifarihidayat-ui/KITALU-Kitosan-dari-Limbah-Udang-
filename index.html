m1s2",title:"Mengapa limbah kulit udang memiliki potensi?",body:["Industri pengolahan udang menghasilkan kulit dan kepala udang sebagai hasil samping. Bagian ini mengandung kitin, yaitu polisakarida struktural yang dapat diolah menjadi kitosan.","Kitosan telah banyak diteliti di bidang biomaterial karena kemampuannya membentuk film dan struktur tertentu. Namun mutu kitosan sangat dipengaruhi bahan awal dan proses pengolahan, sehingga standardisasi menjadi syarat penting."]},{id:"m1s3",title:"Hubungan KITALU dengan ekonomi sirkular",body:["Dalam ekonomi sirkular, sesuatu yang tadinya dianggap limbah diperlakukan sebagai sumber daya. KITALU mencoba merangkai rantai nilai lokal: dari unit pengolahan udang, pengolah bahan baku, peneliti, hingga mitra produksi dan fasilitas kesehatan.","Kebaruan KITALU tidak terletak pada klaim penemuan material baru, melainkan pada integrasi rantai nilai lokal dan model pengembangan yang dapat dievaluasi."]}],quiz:[{q:"Apa kepanjangan KITALU?",options:["Kitin Alami Lautan","Kitosan dari Limbah Udang","Kit Luka Universal","Kolaborasi Industri Tambak Lokal"],answer:1,explain:"KITALU = Kitosan dari Limbah Udang."},{q:"Status KITALU saat ini yang paling tepat adalah…",options:["Produk klinis yang sudah berizin edar","Konsep riset dan model ekosistem yang masih perlu divalidasi","Obat yang terbukti menyembuhkan luka diabetik","Produk yang dijual bebas di apotek"],answer:1,explain:"KITALU adalah kandidat inovasi. Keamanan dan efektivitas harus dibuktikan melalui pengujian dan regulasi."}]},{id:"m2",number:2,title:"Mengenal Kitosan",summary:"Dari kitin ke kitosan, pentingnya standardisasi, dan karakteristik yang perlu diuji.",minutes:7,icon:"flask",sections:[{id:"m2s1",title:"Apa itu kitin?",body:["Kitin adalah polisakarida struktural yang menyusun cangkang krustasea seperti udang dan kepiting, serta dinding sel beberapa jamur. Di alam, kitin terikat bersama mineral (terutama kalsium karbonat) dan protein."]},{id:"m2s2",title:"Bagaimana kitin diolah menjadi kitosan?",body:["Secara umum, pengolahan kulit udang menjadi kitosan melewati beberapa tahap:"],points:["Pembersihan dan pengeringan — menghilangkan kotoran dan sisa daging.","Demineralisasi — melarutkan mineral, umumnya dengan asam encer.","Deproteinasi — menghilangkan protein, umumnya dengan basa encer.","Deasetilasi — mengubah sebagian gugus asetil pada kitin sehingga terbentuk kitosan."]},{id:"m2s3",title:"Mengapa standardisasi bahan penting?",body:["Kitosan dari sumber dan proses yang berbeda dapat memiliki sifat yang sangat berbeda. Tanpa standardisasi, dua batch bisa menghasilkan material dengan kekuatan, kelarutan, atau kemurnian yang tidak sama — dan hasil riset menjadi sulit diulang."]},{id:"m2s4",title:"Karakteristik yang perlu diuji",body:["Beberapa parameter yang lazim dievaluasi:"],points:["Derajat deasetilasi (DD).","Berat molekul dan viskositas.","Kadar air dan kadar abu.","Residu protein dan potensi kontaminan.","Kelarutan dan konsistensi antarbatch."]}],quiz:[{q:"Tahap yang mengubah kitin menjadi kitosan disebut…",options:["Demineralisasi","Deproteinasi","Deasetilasi","Fermentasi"],answer:2,explain:"Deasetilasi menghilangkan sebagian gugus asetil pada kitin sehingga terbentuk kitosan."},{q:"Mengapa konsistensi antarbatch penting?",options:["Agar warna kemasan seragam","Agar sifat material dan hasil riset dapat diulang","Agar harga jual lebih tinggi","Tidak terlalu penting"],answer:1,explain:"Variasi bahan baku dapat menyebabkan perbedaan karakteristik produk, sehingga tiap batch perlu didokumentasikan dan diuji."}]},{id:"m3",number:3,title:"Kombinasi Biomaterial",summary:"Peran kitosan, alginat, dan ekstrak pegagan — serta mengapa formulasi wajib diuji.",minutes:6,icon:"layers",sections:[{id:"m3s1",title:"Kitosan sebagai komponen matriks",body:["Dalam konsep KITALU, kitosan berperan sebagai komponen utama matriks — kerangka yang membentuk film atau hidrogel."]},{id:"m3s2",title:"Alginat: struktur dan pengelolaan cairan",body:["Alginat berasal dari rumput laut cokelat. Alginat dipertimbangkan untuk membantu membentuk struktur dan mengatur karakteristik pengelolaan cairan. Rasio kitosan–alginat perlu dioptimasi karena memengaruhi kekuatan, kestabilan, dan kemampuan menyerap cairan."]},{id:"m3s3",title:"Ekstrak pegagan sebagai kandidat komponen bioaktif",body:["Pegagan (Centella asiatica) mengandung senyawa seperti asiatikosida dan madekasosida yang banyak diteliti dalam konteks kesehatan kulit. Namun, bukti dari penelitian bahan aktif belum cukup untuk menyatakan bahwa formulasi KITALU pasti mempercepat penyembuhan luka.","Karena itu ekstrak harus distandardisasi, dan efeknya perlu dibandingkan dengan formulasi tanpa pegagan."]},{id:"m3s4",title:"Mengapa formulasi perlu diuji secara ilmiah?",body:["Keberhasilan membuat prototipe secara fisik tidak otomatis membuktikan keamanan maupun efektivitas. Formulasi harus melalui uji karakteristik, kestabilan, profil pelepasan senyawa aktif, dan biokompatibilitas."]}],quiz:[{q:"Dari mana alginat umumnya diperoleh?",options:["Kulit udang","Rumput laut cokelat","Daun pegagan","Tulang ikan"],answer:1,explain:"Alginat diperoleh dari rumput laut cokelat."},{q:"Cara yang tepat menguji manfaat ekstrak pegagan dalam formulasi adalah…",options:["Langsung mengklaim mempercepat penyembuhan","Membandingkan dengan formulasi tanpa ekstrak pegagan","Menambah dosis sebanyak mungkin","Mengandalkan testimoni"],answer:1,explain:"Perbandingan terkontrol menunjukkan apakah penambahan pegagan memberi manfaat yang terukur."}]},{id:"m4",number:4,title:"Ekonomi Sirkular",summary:"Beda ekonomi linear dan sirkular, serta bagaimana nilai tambah tercipta sepanjang rantai pasok.",minutes:5,icon:"recycle",sections:[{id:"m4s1",title:"Ekonomi linear vs sirkular",body:["Ekonomi linear berpola ambil–buat–buang. Ekonomi sirkular berupaya menjaga material tetap bernilai selama mungkin, termasuk mengubah hasil samping menjadi bahan baku proses lain."]},{id:"m4s2",title:"Bagaimana limbah menjadi bahan baku",body:["Kulit udang yang tadinya dibuang dapat diolah menjadi kitin dan kitosan. Agar layak, limbah perlu ditangani dengan baik sejak awal: disimpan dingin, dicatat asalnya, dan tidak tercampur kontaminan."]},{id:"m4s3",title:"Peran supplier dan mitra produksi",body:["Setiap aktor menambah nilai pada tahapnya masing-masing:"],points:["Supplier: limbah tertelusur dan tertangani dengan baik.","Pengolah: kitosan dengan spesifikasi terdokumentasi.","Peneliti: formulasi dan bukti ilmiah.","Mitra produksi: proses konsisten sesuai standar mutu."]},{id:"m4s4",title:"Catatan jujur tentang dampak",body:["Pemanfaatan bahan lokal tidak selalu menjamin biaya akhir lebih rendah. Proses ekstraksi juga memakai air, energi, dan bahan kimia, sehingga manfaat ekonomi dan lingkungan perlu dibuktikan melalui analisis biaya dan evaluasi dampak."]}],quiz:[{q:"Pola ekonomi linear adalah…",options:["Ambil–buat–buang","Kurangi–gunakan ulang–daur ulang","Riset–uji–produksi","Kumpul–olah–jual ulang"],answer:0,explain:"Ekonomi linear: ambil sumber daya, buat produk, lalu buang."},{q:"Apakah pemanfaatan limbah lokal pasti membuat produk lebih murah?",options:["Ya, selalu","Tidak selalu — perlu analisis biaya","Ya, jika volumenya besar","Tidak relevan"],answer:1,explain:"Biaya ekstraksi, pemurnian, pengujian, dan produksi perlu dihitung; harga akhir tidak otomatis lebih murah."}]},{id:"m5",number:5,title:"Keamanan dan Validasi",summary:"Mutu bahan baku, uji fisikokimia, biokompatibilitas, dan pentingnya regulasi.",minutes:6,icon:"shield",sections:[{id:"m5s1",title:"Mengapa kualitas bahan baku penting?",body:["Risiko utama meliputi variasi mutu kitosan, kemungkinan kontaminasi atau residu protein, serta ketidakstabilan ekstrak. Bahan baku yang tidak konsisten membuat hasil uji sulit dipercaya."]},{id:"m5s2",title:"Uji karakteristik fisik dan kimia",body:["Uji ini menilai apa material itu dan bagaimana perilakunya: misalnya ketebalan film, kekuatan mekanis, kemampuan menyerap cairan, kestabilan, serta profil pelepasan senyawa aktif."]},{id:"m5s3",title:"Mengapa biokompatibilitas harus dievaluasi?",body:["Material yang bersentuhan dengan jaringan tubuh harus dipastikan tidak menimbulkan reaksi berbahaya. Evaluasi biokompatibilitas mengikuti standar dan tahapan penelitian yang berlaku."]},{id:"m5s4",title:"Mengapa produk medis memerlukan regulasi?",body:["Produk untuk perawatan luka harus memenuhi persyaratan mutu, keamanan, dan perizinan sebelum dapat dipertimbangkan untuk penggunaan klinis. Jalur regulasi ditentukan berdasarkan klasifikasi dan tujuan penggunaan produk.","Penting: materi edukasi ini bukan pengganti konsultasi tenaga kesehatan. Perawatan luka kaki diabetik tetap memerlukan penanganan standar seperti off-loading, pengendalian infeksi, pengendalian gula darah, dan evaluasi sirkulasi."]}],quiz:[{q:"Uji biokompatibilitas bertujuan untuk…",options:["Mengukur harga produksi","Memastikan material tidak menimbulkan reaksi berbahaya pada jaringan","Menentukan warna produk","Mempercepat izin edar"],answer:1,explain:"Biokompatibilitas menilai keamanan material ketika bersentuhan dengan jaringan."},{q:"Jika seseorang memiliki luka kaki diabetik, langkah yang tepat adalah…",options:["Mencoba kandidat material KITALU sendiri","Berkonsultasi dengan tenaga kesehatan","Mengandalkan ekstrak pegagan saja","Menunggu luka sembuh sendiri"],answer:1,explain:"KITALU belum untuk penggunaan klinis. Luka kaki diabetik perlu ditangani tenaga kesehatan."}]}];function R8(){tr("Edukasi");const{progress:e,markRead:t,saveQuiz:n,toast:r}=Se(),[i,a]=P.useState(null),[o,s]=P.useState("materi"),l=x=>$r[x].sections.filter(g=>e.read[g.id]).length,{pct:u,totalItems:f,doneItems:d}=P.useMemo(()=>{const x=$r.reduce((y,b)=>y+b.sections.length+1,0),g=$r.reduce((y,b)=>y+b.sections.filter(j=>e.read[j.id]).length+((e.quiz[b.id]??0)>=b.quiz.length?1:0),0);return{pct:Math.round(g/x*100),totalItems:x,doneItems:g}},[e]),h=(x,g="materi")=>{s(g),a(x)},p=()=>{const x=$r.findIndex((g,y)
